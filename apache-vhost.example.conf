# Exemple de VirtualHost Apache pour Coachingpro.
# À copier dans /etc/apache2/sites-available/coachingpro.conf
# Puis :
#   sudo a2ensite coachingpro
#   sudo a2enmod rewrite
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName coachingpro.local
    # ServerAlias www.coachingpro.example.com

    DocumentRoot /var/www/coachingpro/public

    <Directory /var/www/coachingpro/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Sécurité : bloque l'accès direct aux dossiers sensibles
    <Directory /var/www/coachingpro/public/bundles>
        FallbackResource disabled
    </Directory>

    # Logs séparés (utile pour debug)
    ErrorLog ${APACHE_LOG_DIR}/coachingpro_error.log
    CustomLog ${APACHE_LOG_DIR}/coachingpro_access.log combined

    # Désactive la signature serveur (sécurité)
    ServerSignature Off
</VirtualHost>

